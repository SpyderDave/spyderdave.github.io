name: Update Repo List

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch repos from GitHub API
        run: |
          curl -s https://api.github.com/users/SpyderDave/repos \
          > repos_raw.json

      - name: Transform repo data
        run: |
          cat repos_raw.json | jq '
          map(
            select(.fork == false and .private == false)
          )
          | sort_by(.updated_at)
          | reverse
          | map({
              name: .name,
              html_url: .html_url,
              description: .description,
              stargazers_count: .stargazers_count,
              forks_count: .forks_count,
              updated_at: .updated_at,
              language: .language
            })
          ' > repos.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add repos.json
          git commit -m "Auto-update repos.json" || echo "No changes"
          git push