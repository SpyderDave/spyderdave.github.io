<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpyderDave | Portfolio</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5}
header{background:#24292e;color:#fff;padding:20px;text-align:center}
.container{max-width:1000px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.card{background:#fff;padding:15px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
a{text-decoration:none;color:#0366d6}
.footer{text-align:center;padding:20px;color:#666}
</style>
</head>
<body>
<header>
<h1>SpyderDave's Projects</h1>
<p>Static, fast, no API limits</p>
</header>

<div class="container">
<div class="grid" id="repo-list">Loading...</div>
</div>

<div class="footer">
Last updated: <span id="updated"></span>
</div>

<script>
fetch('repos.json')
.then(r => r.json())
.then(data => {
  const c = document.getElementById('repo-list');
  c.innerHTML = '';
  data.sort((a,b)=> new Date(b.updated_at)-new Date(a.updated_at));
  data.forEach(repo=>{
    if(repo.fork) return;
    const d=document.createElement('div');
    d.className='card';
    d.innerHTML = `
      <h3><a href="${repo.html_url}" target="_blank">${repo.name}</a></h3>
      <p>${repo.description || "No description provided."}</p>
      <p>⭐ ${repo.stargazers_count} | 🍴 ${repo.forks_count}</p>
    `;
    c.appendChild(d);
  });
  document.getElementById('updated').innerText = new Date().toLocaleString();
})
.catch(e=>{
  document.getElementById('repo-list').innerHTML="Failed to load repos.json";
  console.error(e);
});
</script>

</body>
</html>
